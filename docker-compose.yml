# Entorno local de desarrollo. Solo infraestructura; las apps corren con `turbo run dev`.
# `pnpm dev` levanta postgres + redis y después las aplicaciones.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: posbar
      POSTGRES_PASSWORD: posbar
      POSTGRES_DB: posbar
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U posbar -d posbar']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
